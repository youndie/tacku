# The chart carries no environment. Everything below is either a shape or a default that is safe
# anywhere; the addresses of a particular cluster live with that cluster, not here.
#
# Four values have no default on purpose, and the templates stop the render when they are empty
# rather than deploying something that starts and misbehaves. Each is listed with what its absence
# would actually do.

# Where this instance answers. Empty renders `Host(``)`, which matches nothing while looking like a
# working ingress.
hostname: ""

server:
  image: ghcr.io/youndie/tacku
  # An immutable tag by agreement. Rebuilding under one number leaves helm nothing to notice — the
  # rendered spec is unchanged, so no pod restarts — and a green deploy then runs the old binary.
  version: ""
  replicas: 1
  resources:
    requests:
      cpu: "20m"
      memory: "48Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# The signing key of a person's session. Absent, the server generates one at startup and says so on
# stderr — which means every rollout silently signs everybody out, and the message is in a log
# nobody reads. Comes from a secret through --set.
sessionKey: ""

# The issuer of the tokens agents arrive with. The server refuses to start without all three,
# which is the correct behaviour and not a reason to leave them blank here: a pod that will not
# start is a deploy that reports success and a service that is down.
auth:
  issuer: ""
  jwksUrl: ""
  # The audience an agent's token must be bound to (RFC 8707). Derived from the hostname when
  # empty, because it is the address of this server's own MCP endpoint and nothing else.
  resource: ""

# How a person signs in to the browser client. Both the audience and the client identifier are
# public — they travel in the address bar during the redirect — and the page reads them from the
# server at /auth/config, so no configuration is compiled into the bundle.
page:
  # What the page calls itself to the provider. A public client: a page keeps no secret, so the flow
  # is authorization code with PKCE and nothing else. No default — a wrong or absent client id fails
  # in somebody's browser rather than at startup, which is a deploy that reports success.
  clientId: ""
  # The audience a person's token must carry. Derived from the hostname when empty, because it is
  # the address of the page itself — and it must be **different** from auth.resource above.
  audience: ""

db:
  size: 2Gi
  class: local-path

# How long an untouched multi-step scenario is kept. Empty leaves the server's own default.
wizardTtl: ""

# The read-only view over a backlog that lives in another repository: one file per item, the method
# this project documents itself with. Empty `repo` means the deployment shows none — no endpoint, no
# route in the navigation graph, nothing in the rail — which is the shape every deployment had until
# this existed.
#
# The repository is named here rather than in the image because it is a property of a deployment and
# not of the product: this chart is public, and a repository name committed to it cannot be taken
# back out of the clones.
docs:
  # owner/name of the source repository.
  repo: ""
  # The branch to read. Empty means main.
  ref: ""
  # Where the item files sit inside it. Empty means docs/backlog, which is where the method puts
  # them; a repository whose whole content is documentation keeps them at backlog.
  root: ""
  # The index file carrying the stage table and the title. Empty means backlog.md.
  index: ""
  # How long a reading is served before the source is asked whether it moved. Empty means a minute.
  ttl: ""
  # A read-only credential for that repository, from a secret through --set. A private source
  # answers 404 to an anonymous request, so a missing token arrives as "no such repository".
  token: ""

traefik:
  entrypoint: websecure
  certResolver: ""
