{{/*
The two values that must not be in a values file, in a Secret of their own.

Rendered from --set at deploy time, which is why the chart refuses an empty one here rather than
letting the deployment mount a Secret with an empty string in it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  session-key: {{ include "tacku.require" (dict "name" "sessionKey" "because" "without it the server signs a new key at every start and every rollout logs everybody out, silently" "value" .Values.sessionKey) | quote }}
