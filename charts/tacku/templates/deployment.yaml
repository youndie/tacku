apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.server.replicas }}
  # Recreate, not RollingUpdate: see the note beside the volume. A rolling update here waits for a
  # volume the outgoing pod has not released, which reads as a deploy that hangs rather than as a
  # database that cannot be shared.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
      annotations:
        # So that a change to a secret restarts the pod. Without it the rendered spec is unchanged
        # when only the secret moved, and the running process keeps the value it started with.
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        # The image runs as nonroot; the volume has to belong to that user or the first write to
        # the database fails as a permission error that looks like a corrupt file.
        fsGroup: 65532
      containers:
        - name: server
          image: "{{ .Values.server.image }}:{{ include "tacku.require" (dict "name" "server.version" "because" "an image tag that moves leaves helm nothing to notice, and a green deploy then runs the previous binary" "value" .Values.server.version) }}"
          # The page is served by the same process on the same address. A second container, or a
          # second host, would mean CORS between our own halves and a second thing to roll out.
          args: ["serve", "-db", "/data/tacku.db", "-addr", ":8080", "-web", "/app/web"]
          env:
            - name: TACKU_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: session-key
            - name: TACKU_ISSUER
              value: {{ include "tacku.require" (dict "name" "auth.issuer" "because" "the server refuses to start without it, which arrives as a successful deploy and a service that is down" "value" .Values.auth.issuer) | quote }}
            - name: TACKU_JWKS_URL
              value: {{ include "tacku.require" (dict "name" "auth.jwksUrl" "because" "without it no agent token can be verified, and the path is not derivable from the issuer — ask the provider's discovery document rather than guessing from the shape of the issuer URL" "value" .Values.auth.jwksUrl) | quote }}
            - name: TACKU_RESOURCE
              value: {{ include "tacku.resource" . | quote }}
            # The page's own audience, separate from the MCP resource above. A token good at both
            # surfaces is the confused deputy the whole scheme is built against: an agent's token,
            # talked out of an agent, would open the screens as well.
            - name: TACKU_PAGE_AUDIENCE
              value: {{ include "tacku.pageAudience" . | quote }}
            - name: TACKU_PAGE_CLIENT_ID
              value: {{ include "tacku.require" (dict "name" "page.clientId" "because" "without it the page cannot ask the provider for a token, and it fails in the browser rather than at startup — a deploy that looks entirely successful" "value" .Values.page.clientId) | quote }}
            {{- if .Values.wizardTtl }}
            - name: TACKU_WIZARD_TTL
              value: {{ .Values.wizardTtl | quote }}
            {{- end }}
            {{- if .Values.docs.repo }}
            # The source of the read-only view. Set together or not at all: the server treats an
            # empty repository as "this deployment shows no such board".
            - name: TACKU_DOCS_REPO
              value: {{ .Values.docs.repo | quote }}
            - name: TACKU_DOCS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: docs-token
            {{- with .Values.docs.ref }}
            - name: TACKU_DOCS_REF
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docs.root }}
            - name: TACKU_DOCS_ROOT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docs.index }}
            - name: TACKU_DOCS_INDEX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.docs.ttl }}
            - name: TACKU_DOCS_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          # /healthz answers without a token and without touching the database, which is what makes
          # it usable here: a probe that authenticated would report the identity provider's health,
          # and one that read the store would restart the pod for a slow query.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
