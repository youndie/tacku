org.gradle.caching=true

# Measured, not chosen: the Kotlin/Wasm production compilation dies with `OutOfMemoryError: Java
# heap space` in `compileProductionExecutableKotlinWasmJs` on a hosted runner, whose default heap is
# a fraction of a developer machine's. The other targets never noticed, which is why it surfaced
# only when the image build compiled the page for the first time.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
kotlin.code.style=official

# The one version that pins the contract this project is written against. The Go server reads the
# schema files this build generates, so bumping it here is a protocol change, not a dependency bump.
kompot.version=0.25.2.42
