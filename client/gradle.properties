org.gradle.caching=true

# Measured, not chosen: the Kotlin/Wasm production compilation dies with `OutOfMemoryError: Java
# heap space` in `compileProductionExecutableKotlinWasmJs` on a hosted runner, whose default heap is
# a fraction of a developer machine's. The other targets never noticed, which is why it surfaced
# only when the image build compiled the page for the first time.
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
kotlin.code.style=official

# The one version that pins the contract this project is written against. The Go server reads the
# schema files this build generates, so bumping it here is a protocol change, not a dependency bump.
#
# Published under io.github.youndie.kompot since 0.38 (it was io.github.youndie up to 0.37), and the
# Compose half of it is compiled against Compose Multiplatform 1.12.1 with material3 1.12.0-alpha03:
# the Compose plugin in build.gradle.kts and material3 in :shared and :app move with this number,
# never apart from it.
#
# A snapshot on purpose: kompot is stabilising the 0.40 line, and its consumers live on the
# continuous build (0.40.0.<run>, from the snapshot repository in settings.gradle.kts) until 0.40.0
# is on Central, so that whatever this project finds becomes a kompot issue before the release
# rather than after it. Back to a Central version when there is one.
kompot.version=0.40.0.210
