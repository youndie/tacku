<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tacku</title>
    <!--
      The background is the product's surface token, written out here and nowhere else it can be
      taken from: this paints before a single line of the application has run, and the alternative is
      a white flash on every load. It is the one place a colour is duplicated, and it is duplicated
      knowingly.
    -->
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #101114; }
        canvas { outline: none; }
    </style>
</head>
<body>
<!--
  Absolute, and that is not tidiness. The page is served at every address it has a screen at, so at
  /edit-task/TAC-2 a relative src asks for /edit-task/tacku.js — which the server answers with this
  very page, because the path looks like a screen. The browser then parses HTML as JavaScript and
  the application never starts: a blank window, no error a person could act on.
-->
<script src="/tacku.js"></script>
</body>
</html>
