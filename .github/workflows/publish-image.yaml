name: Publish image

# Manual on purpose. The tag is a fixed version rather than a moving `latest`, and the deploy that
# consumes it lives in another repository — so publishing is a decision rather than a side effect
# of merging.
#
# The version comes from the chart, which is the only place in this repository that carries one.
# Reading it from there rather than from an input means the tag and the chart cannot disagree: a
# published image nobody's values point at, or values pointing at an image nobody published, are
# both silent.

on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    # Pushing to ghcr under the same owner needs no personal token: the job's own GITHUB_TOKEN is
    # enough once it may write packages.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The page is built here rather than inside the image: a Gradle build in a Docker layer starts
      # from nothing every time, while this runner shares the cache the check job fills. The
      # Dockerfile copies what this step leaves behind, and fails outright if it is not there.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            client/*.gradle.kts
            client/**/*.gradle.kts
            client/gradle.properties
            client/gradle/wrapper/gradle-wrapper.properties

      - name: Build the page
        working-directory: client
        run: ./gradlew --no-daemon :web:wasmJsBrowserDistribution

      # Compressed once here rather than per request in the server: the files never change, and a
      # compressor working offline can afford its slowest setting. Measured on this bundle:
      # 4 511 076 bytes of WebAssembly leave as 1 326 026 gzipped and 996 564 with brotli.
      - name: Compress the page
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq brotli
          scripts/precompress.sh client/web/build/dist/wasmJs/productionExecutable

      # A bundle that built but produced nothing would be copied into the image and refused at
      # startup — after publishing, and by a pod that then rolls back. Cheaper to say it here.
      - name: Refuse a bundle without a page in it
        run: |
          dist=client/web/build/dist/wasmJs/productionExecutable
          for file in index.html tacku.js; do
            if [ ! -s "$dist/$file" ]; then
              echo "$dist/$file is missing or empty — the image would carry no product" >&2
              exit 1
            fi
          done
          # And that the compression above actually happened. The server falls back to the
          # originals when a compressed sibling is missing, so an image without them serves the
          # page perfectly — four times heavier, and with nothing to say so.
          for file in tacku.js index.html; do
            for encoding in gz br; do
              if [ ! -s "$dist/$file.$encoding" ]; then
                echo "$dist/$file.$encoding is missing — the page would ship uncompressed" >&2
                exit 1
              fi
            done
          done

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Take the version from the chart
        run: |
          version="$(grep '^appVersion:' charts/tacku/Chart.yaml | cut -d'"' -f2)"
          if [ -z "$version" ]; then
            echo "charts/tacku/Chart.yaml carries no appVersion, so there is no tag to publish" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Refused rather than overwritten. An image republished under one tag leaves helm nothing to
      # notice — the rendered spec is unchanged, so no pod restarts — and the cluster keeps running
      # the previous binary behind a green deploy.
      - name: Refuse a tag that already exists
        run: |
          if docker manifest inspect "ghcr.io/youndie/tacku:${VERSION}" >/dev/null 2>&1; then
            echo "ghcr.io/youndie/tacku:${VERSION} is already published — raise appVersion in the chart" >&2
            exit 1
          fi

      # amd64 only: that is what the cluster runs, and a second platform is a second build rather
      # than a second manifest entry.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/youndie/tacku:${{ env.VERSION }}
