# The gate, from docs-bootstrap's templates/workflow-check.yaml. `docs/` lives inside this
# repository, so `make check` needs no arguments; the Makefile at the root is its other half.
#
# THE VERSION OF THE CHECKS IS WRITTEN HERE AND NOWHERE ELSE: the ref in the `uses:` lines below.
# CI runs the checks at that ref because the runner resolves it; the Makefile reads the same line
# and fetches the same ref for a local `make check`. Renovate's github-actions manager bumps it, so a
# release of the checks arrives as one pull request that moves CI and every laptop together. Both
# jobs name the same ref, and the Makefile refuses to guess when they do not.
#
# Do not replace the action with copied scripts to save a network fetch. That is how one portfolio
# came to hold 18 copies of one script in three versions, eleven of them missing a guard that had
# been fixed upstream for weeks.
#
# RUNNER. GitHub-hosted, because this repository is public and standard runners are free for public
# repositories. The account's other, private repositories run on a self-hosted runner instead —
# their billed minutes are unpaid, and a job there does not merely start slowly, it never starts.
# That is a property of those repositories, not of this workflow: do not copy the label from here
# into a private one without checking which side of that line it falls on.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. The action runs `make check` - exactly the target a contributor runs, so that "green
  # here, red there" cannot become the normal state of affairs - and around it the two checks that
  # depend on the event: on a pull request, backlog item numbers against the base branch, BEFORE the
  # gate; on a push to the default branch, `status: draft` as an error. Why each sits where it does,
  # and when the first is only a backstop, is written next to the step in the action's action.yml.
  #
  # Checks of the project's own belong in the Makefile under `gate`, not as steps here: then a
  # contributor runs them too. Here the gate is the documents, the Kotlin half and the Go half, so
  # Go and the JDK are set up BEFORE the action - the action is what runs `make check`.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      # 25 because kompot is published for it: resolution fails outright on 21 with "only
      # compatible with JVM runtime version 25 or newer".
      #
      # The cache is not here for speed. Hosted runners share addresses with everybody else's, and
      # Maven Central answers 429 to them often enough that the first run of this workflow died on
      # one — a red build nobody caused, which is the kind people learn to ignore. A warm cache
      # does not ask for the artefacts at all.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            client/*.gradle.kts
            client/**/*.gradle.kts
            client/gradle.properties
            client/gradle/wrapper/gradle-wrapper.properties

      # The Python the checks and this repository's own scripts under `gate` run on.
      - uses: youndie/docs-bootstrap@v0.3.8
        with:
          python-version: "3.14"

      # The evidence of a failed screenshot comparison, which otherwise dies with the runner.
      #
      # `if: failure()` rather than `always()`: on a green run there is nothing in there worth
      # keeping, and an artifact that is always present is one nobody looks at. This exists because
      # of a run where twelve screenshots disagreed and the log said only "12 failed" — the images
      # that would have said *how* were on a machine that no longer existed.
      # What this machine drew, not only where it disagrees. A diff says which pixels differ; the
      # picture says whether the text moved, changed weight or changed typeface — and those have
      # different causes. Recording overwrites the goldens in the workspace, which is why it runs
      # after the gate has already failed and never on a green run.
      - if: failure()
        run: cd client && ./gradlew --quiet :app:viddikRecord || true

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: |
            client/app/build/reports/tests/viddikVerify
            client/app/build/reports/screenshots
            client/app/src/test/snapshots
          if-no-files-found: ignore
          retention-days: 7

      # THE CONFORMANCE WALK, and it is here now for a reason that did not hold before.
      #
      # It was deliberately outside every automated set while it was red: a red walk was a finding
      # about this server for a person to read and classify, not a broken build — and a build that
      # is red on purpose teaches everybody to ignore it.
      #
      # From kompot 0.17.0.24 it passes with every declared endpoint checked, 11 of 11. So its
      # redness now means something changed rather than something is unfinished, and a check that
      # runs only when somebody remembers is a check that rots. The most likely change it catches is
      # an endpoint added without anything to reach it with: the walk skips it, the count drops, and
      # nobody would notice until the next hand-run.
      #
      # It is a step of this job rather than a job of its own so that it runs against the same tree
      # the gate just checked, and stops on the same failure.
      - run: make tck

  # On a schedule, apart from the gate. The list is at zero and every path outside this repository
  # is an address (SPEC 4.1) - inside a dependency's artefact or at a commit of another repository -
  # which nothing elsewhere can move. So the report blocks: the Makefile sets `ANCHORS_ARGS=--check`,
  # and `make check` in the gate fails on a path of this repository's own that resolves to nothing,
  # in the pull request that broke it. This job runs the same report on the default branch once a
  # week.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The code lives in this checkout, so its parent is a directory whose one subdirectory is
      # this repository - which is exactly what REPOS (`..` by default) expects.
      - uses: youndie/docs-bootstrap@v0.3.8
        with:
          target: report
          python-version: "3.14"

      # For a separate documentation repository, put shallow clones of the services next to the
      # step above and point REPOS at them. History is not needed — only the file tree — and a
      # repository that cannot be cloned is a warning rather than a failure, because its anchors are
      # simply unchecked.
      #
      # `secrets.GITHUB_TOKEN` is scoped to the repository running the workflow. That is enough for
      # public services, which is how the block below was tested; a private one needs a token that
      # can read it, and with the default one it will take the warning branch every week without
      # ever saying why.
      #
      #   - run: |
      #       mkdir -p repos && cd repos
      #       for r in service-one service-two; do
      #         git clone --depth 1 --filter=blob:none --no-checkout \
      #           "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/$r.git" \
      #           || echo "::warning::$r is unreachable - its anchors were not checked"
      #       done
      #     env:
      #       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   - uses: youndie/docs-bootstrap@v0.3.8
      #     with:
      #       target: report REPOS=repos
